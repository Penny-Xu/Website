<title>Collective operations, step by step</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #d4d4d4;
    --bg: #fdfdfc;
    --panel: #f4f4f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 840px; margin: 0 auto; padding: 16px 12px 24px; }
  svg { width: 100%; height: auto; display: block; }
  text { font-family: "SF Mono", Menlo, Consolas, monospace; }
  .hidden { opacity: 0; }
  g { transition: opacity .35s ease; }
  .caption {
    min-height: 92px;
    margin: 14px 2px 0;
    font-size: 14.5px;
    line-height: 1.6;
  }
  .caption b { font-weight: 600; }
  .caption code {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    background: var(--panel);
    padding: 1px 4px;
    border-radius: 2px;
  }
  .controls {
    display: flex; align-items: center; gap: 10px;
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  button {
    font: inherit; font-size: 13px;
    padding: 6px 14px;
    border: 1px solid var(--line);
    background: #fff; color: var(--ink);
    border-radius: 3px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--panel); }
  button:disabled { opacity: .4; cursor: default; }
  .count { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; color: var(--muted); }
  .dots { display: flex; gap: 5px; margin-left: auto; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); cursor: pointer; }
  .dot.on { background: var(--ink); }
</style>
</head>

<div class="caption" id="cap"></div>

<div class="controls">
  <button id="prev">← Prev</button>
  <button id="next">Next →</button>
  <span class="count" id="count"></span>
  <div class="dots" id="dots"></div>
</div>
</div>

<script>
const steps = [
  {
    show: ["g-start"],
    cap: "Four GPUs, each holding a tensor of the <b>same shape</b>, split into four chunks for bookkeeping. GPU&nbsp;0's chunks are <code>a0…a3</code>, GPU&nbsp;1's are <code>b0…b3</code>, and so on. Every collective below starts from exactly this state. The only thing that differs is <b>who ends up with what</b>."
  },
  {
    show: ["g-start","g-arrow-reduce","g-res-reduce"],
    cap: "<b>reduce</b> — everyone contributes, <b>one</b> GPU gets the sum. <code>Σ0 = a0+b0+c0+d0</code>, and so on for each chunk. GPU&nbsp;0 ends up with the complete elementwise sum; the other three end up with nothing useful. It's the cheapest of the four, and almost never what tensor parallelism wants — the other GPUs still need the answer to continue."
  },
  {
    show: ["g-start","g-arrow-down","g-res-allreduce"],
    cap: "<b>all-reduce</b> — same sum, but <b>every</b> GPU gets it. This is the one tensor parallelism needs after each attention and MLP block: every GPU holds a full-shape <i>partial</i> sum, and all of them need the real value, because the next layer's column-parallel GEMM requires the full input replicated everywhere. <b>Shape in = shape out.</b> Only the values change."
  },
  {
    show: ["g-start","g-arrow-down","g-res-rs"],
    cap: "<b>reduce-scatter</b> — everyone contributes, but each GPU keeps only <b>one slice</b> of the sum. Every chunk of the answer now exists exactly once, and no single GPU has the whole thing. Each ends up holding <code>1/N</code> of the data, which makes this considerably cheaper than all-reduce."
  },
  {
    show: ["g-start-ag","g-arrow-down","g-res-ag"],
    cap: "<b>all-gather</b> — the only one with <b>no arithmetic at all</b>. Note the different starting state: each GPU begins with a <i>different</i> slice, every one already correct. Afterwards everyone holds all of them, laid end to end. <b>The output is N× larger than the input</b> — the opposite of all-reduce, where the shape never changes. That's the real distinction: same region with wrong values → add them; different regions with right values → stack them."
  },
  {
    show: ["g-start","g-id-rs","g-id-ag","g-id-note"],
    cap: "Now put two of them together. Start with full tensors, <b>reduce-scatter</b> so the sum exists once and is spread out, then <b>all-gather</b> so everyone collects all the pieces. The result is every GPU holding the complete sum — which is the definition of all-reduce. It's also how real implementations actually do it."
  },
  {
    show: ["g-start","g-ring-topo","g-ring1"],
    cap: "The <b>ring</b>. Arrange the GPUs in a circle; each one sends <b>only to its right neighbour</b>, ever. On the first pass, GPU&nbsp;0 sends chunk&nbsp;0 to GPU&nbsp;1, which adds it to its own chunk&nbsp;0; GPU&nbsp;1 sends chunk&nbsp;1 to GPU&nbsp;2, and so on around the ring. Four transfers happen <b>simultaneously</b>, each over a separate link."
  },
  {
    show: ["g-start","g-ring-topo","g-ring1","g-ring3"],
    cap: "After <b>N−1 = 3</b> passes, every chunk has visited every GPU exactly once and been accumulated along the way. Each GPU now owns exactly one <b>fully summed</b> chunk — GPU&nbsp;3 has <code>Σ0</code>, GPU&nbsp;0 has <code>Σ1</code>, and so on. That is reduce-scatter, completed with nothing but neighbour-to-neighbour transfers."
  },
  {
    show: ["g-start","g-ring-topo","g-ring3","g-ring4"],
    cap: "Then the <b>all-gather</b> phase: three more laps, circulating those finished chunks around the same ring. <b>No arithmetic this time</b> — pure copying, each GPU passing along what it just received. After 3 more passes everyone holds all four summed chunks. The all-reduce is complete in <b>2(N−1) = 6</b> steps."
  },
  {
    show: ["g-ring-topo","g-start","g-bw"],
    cap: "And here's the payoff. Each GPU sends <code>N−1</code> chunks in each phase, and each chunk is <code>1/N</code> of the tensor — so every GPU moves <code>2D·(N−1)/N</code> bytes total, which <b>approaches 2D and never exceeds it</b>. Going from 8 GPUs to 64 barely changes what any GPU sends. <b>Ring all-reduce's bandwidth cost does not grow with GPU count.</b> Which is why, when tensor parallelism gets expensive during decode, the culprit isn't bandwidth — it's the fixed per-collective latency you pay 56 times a step, and that one doesn't amortize."
  }
];

const allGroups = ["g-start","g-start-ag","g-res-reduce","g-res-allreduce","g-res-rs","g-res-ag","g-arrow-reduce","g-arrow-down","g-id-rs","g-id-ag","g-id-note","g-ring1","g-ring3","g-ring4","g-ring-topo","g-bw"];
let i = 0;

const capEl = document.getElementById("cap");
const countEl = document.getElementById("count");
const prevEl = document.getElementById("prev");
const nextEl = document.getElementById("next");
const dotsEl = document.getElementById("dots");

steps.forEach((_, n) => {
  const d = document.createElement("div");
  d.className = "dot";
  d.onclick = () => { i = n; render(); };
  dotsEl.appendChild(d);
});

function render() {
  const s = steps[i];
  allGroups.forEach(id => {
    document.getElementById(id).classList.toggle("hidden", !s.show.includes(id));
  });
  capEl.innerHTML = s.cap;
  countEl.textContent = (i + 1) + " / " + steps.length;
  prevEl.disabled = i === 0;
  nextEl.disabled = i === steps.length - 1;
  [...dotsEl.children].forEach((d, n) => d.classList.toggle("on", n === i));
}

prevEl.onclick = () => { if (i > 0) { i--; render(); } };
nextEl.onclick = () => { if (i < steps.length - 1) { i++; render(); } };
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") nextEl.click();
  if (e.key === "ArrowLeft") prevEl.click();
});

render();
</script>
