<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What lives in the KV cache</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #d4d4d4;
    --bg: #fdfdfc;
    --q: #c2742a;
    --q-bg: #faf0e3;
    --k: #2f6ea8;
    --k-bg: #e8f1f8;
    --v: #3d7a4e;
    --v-bg: #e9f3eb;
    --panel: #f4f4f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 840px; margin: 0 auto; padding: 16px 12px 24px; }
  svg { width: 100%; height: auto; display: block; }
  text { font-family: "SF Mono", Menlo, Consolas, monospace; }
  .hidden { opacity: 0; }
  g { transition: opacity .35s ease; }
  .caption {
    min-height: 72px;
    margin: 14px 2px 0;
    font-size: 14.5px;
    line-height: 1.6;
  }
  .caption b { font-weight: 600; }
  .caption code {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    background: var(--panel);
    padding: 1px 4px;
    border-radius: 2px;
  }
  .controls {
    display: flex; align-items: center; gap: 10px;
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  button {
    font: inherit; font-size: 13px;
    padding: 6px 14px;
    border: 1px solid var(--line);
    background: #fff; color: var(--ink);
    border-radius: 3px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--panel); }
  button:disabled { opacity: .4; cursor: default; }
  .count { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; color: var(--muted); }
  .dots { display: flex; gap: 5px; margin-left: auto; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); cursor: pointer; }
  .dot.on { background: var(--ink); }
</style>
</head>
<body>
<div class="wrap">

<svg viewBox="0 0 820 400" role="img" aria-label="KV cache animation">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
    </marker>
    <marker id="arrowdark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- ===== step 1: tokens and embedding ===== -->
  <g id="g-tokens">
    <text x="30" y="22" font-size="10.5" fill="#6b6b6b">PROMPT, TOKENIZED</text>
    <g font-size="13">
      <rect x="30"  y="30" width="92" height="30" rx="3" fill="#fff" stroke="#d4d4d4"/>
      <text x="76"  y="50" text-anchor="middle">hey</text>
      <rect x="130" y="30" width="92" height="30" rx="3" fill="#fff" stroke="#d4d4d4"/>
      <text x="176" y="50" text-anchor="middle">my</text>
      <rect x="230" y="30" width="92" height="30" rx="3" fill="#fff" stroke="#d4d4d4"/>
      <text x="276" y="50" text-anchor="middle">friend</text>
    </g>
    <path d="M176,64 L176,86" fill="none" stroke="#8a8a8a" stroke-width="1.3" marker-end="url(#arrow)"/>
    <rect x="30" y="90" width="292" height="28" rx="3" fill="var(--panel)" stroke="#d4d4d4"/>
    <text x="176" y="109" text-anchor="middle" font-size="12">x  =  [ 3 tokens × 3584 ]</text>
  </g>

  <!-- step 1–2 annotations only -->
  <g id="g-tokens-note">
    <text x="336" y="43" font-size="11" fill="#6b6b6b">3 tokens, each one an integer</text>
    <text x="336" y="57" font-size="11" fill="#6b6b6b">looked up in the embedding table</text>
    <text x="336" y="108" font-size="11" fill="#6b6b6b">this matrix is what enters layer 1</text>
  </g>

  <!-- ===== new token appended (step 6) ===== -->
  <g id="g-newtok" class="hidden">
    <rect x="330" y="30" width="92" height="30" rx="3" fill="#fff" stroke="#1a1a1a" stroke-dasharray="3 2"/>
    <text x="376" y="50" text-anchor="middle" font-size="13">hi</text>
    <text x="432" y="48" font-size="11" fill="#1a1a1a">generated — now fed back in alone</text>
  </g>

  <!-- ===== layer box ===== -->
  <g id="g-layer" class="hidden">
    <rect x="30" y="140" width="450" height="180" rx="4" fill="none" stroke="#d4d4d4"/>
    <text x="44" y="159" font-size="10.5" fill="#6b6b6b">LAYER 1 — one of 28, each with its own weights</text>

    <rect x="46" y="218" width="62" height="28" rx="3" fill="var(--panel)" stroke="#d4d4d4"/>
    <text x="77" y="237" text-anchor="middle" font-size="12">x</text>

    <path d="M110,224 L176,188" fill="none" stroke="#8a8a8a" stroke-width="1.3" marker-end="url(#arrow)"/>
    <path d="M110,232 L176,232" fill="none" stroke="#8a8a8a" stroke-width="1.3" marker-end="url(#arrow)"/>
    <path d="M110,240 L176,276" fill="none" stroke="#8a8a8a" stroke-width="1.3" marker-end="url(#arrow)"/>

    <text x="124" y="196" font-size="9.5" fill="#8a8a8a">W_Q</text>
    <text x="124" y="228" font-size="9.5" fill="#8a8a8a">W_K</text>
    <text x="124" y="284" font-size="9.5" fill="#8a8a8a">W_V</text>

    <rect x="180" y="174" width="128" height="28" rx="3" fill="var(--q-bg)" stroke="var(--q)"/>
    <text x="244" y="193" text-anchor="middle" font-size="12" fill="var(--q)">Q   3 × 3584</text>

    <rect x="180" y="218" width="128" height="28" rx="3" fill="var(--k-bg)" stroke="var(--k)"/>
    <text x="244" y="237" text-anchor="middle" font-size="12" fill="var(--k)">K   3 × 512</text>

    <rect x="180" y="262" width="128" height="28" rx="3" fill="var(--v-bg)" stroke="var(--v)"/>
    <text x="244" y="281" text-anchor="middle" font-size="12" fill="var(--v)">V   3 × 512</text>

    <text x="318" y="246" font-size="9.5" fill="#8a8a8a">one row</text>
    <text x="318" y="258" font-size="9.5" fill="#8a8a8a">per token</text>
  </g>

  <!-- ===== Q discarded ===== -->
  <g id="g-qdrop" class="hidden">
    <path d="M312,188 L366,188" fill="none" stroke="var(--q)" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="372" y="184" font-size="10.5" fill="var(--q)">attention scores,</text>
    <text x="372" y="197" font-size="10.5" fill="var(--q)">then discarded</text>
    <line x1="180" y1="174" x2="308" y2="202" stroke="var(--q)" stroke-width="1.1" opacity=".5"/>
  </g>

  <!-- ===== K,V to cache ===== -->
  <g id="g-tocache" class="hidden">
    <path d="M312,232 L516,218" fill="none" stroke="var(--k)" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M312,276 L516,240" fill="none" stroke="var(--v)" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="378" y="262" font-size="10.5" fill="#6b6b6b">kept</text>
  </g>

  <!-- ===== cache panel ===== -->
  <g id="g-cache" class="hidden">
    <rect x="520" y="140" width="270" height="180" rx="4" fill="var(--panel)" stroke="#d4d4d4"/>
    <text x="534" y="159" font-size="10.5" fill="#6b6b6b">KV CACHE</text>
    <text x="560" y="175" font-size="9.5" fill="#6b6b6b" text-anchor="middle">hey</text>
    <text x="602" y="175" font-size="9.5" fill="#6b6b6b" text-anchor="middle">my</text>
    <text x="644" y="175" font-size="9.5" fill="#6b6b6b" text-anchor="middle">friend</text>
  </g>

  <!-- layer 1 row -->
  <g id="g-row1" class="hidden">
    <text x="533" y="192" font-size="10" fill="#6b6b6b">L1</text>
    <rect x="544" y="182" width="32" height="13" fill="var(--k-bg)" stroke="var(--k)" stroke-width=".9"/>
    <rect x="544" y="197" width="32" height="13" fill="var(--v-bg)" stroke="var(--v)" stroke-width=".9"/>
    <rect x="586" y="182" width="32" height="13" fill="var(--k-bg)" stroke="var(--k)" stroke-width=".9"/>
    <rect x="586" y="197" width="32" height="13" fill="var(--v-bg)" stroke="var(--v)" stroke-width=".9"/>
    <rect x="628" y="182" width="32" height="13" fill="var(--k-bg)" stroke="var(--k)" stroke-width=".9"/>
    <rect x="628" y="197" width="32" height="13" fill="var(--v-bg)" stroke="var(--v)" stroke-width=".9"/>
    <text x="672" y="192" font-size="9" fill="var(--k)">K</text>
    <text x="672" y="207" font-size="9" fill="var(--v)">V</text>
  </g>

  <!-- remaining layers -->
  <g id="g-rows" class="hidden">
    <text x="533" y="232" font-size="10" fill="#6b6b6b">L2</text>
    <rect x="544" y="222" width="32" height="13" fill="var(--k-bg)" stroke="var(--k)" stroke-width=".9"/>
    <rect x="544" y="237" width="32" height="13" fill="var(--v-bg)" stroke="var(--v)" stroke-width=".9"/>
    <rect x="586" y="222" width="32" height="13" fill="var(--k-bg)" stroke="var(--k)" stroke-width=".9"/>
    <rect x="586" y="237" width="32" height="13" fill="var(--v-bg)" stroke="var(--v)" stroke-width=".9"/>
    <rect x="628" y="222" width="32" height="13" fill="var(--k-bg)" stroke="var(--k)" stroke-width=".9"/>
    <rect x="628" y="237" width="32" height="13" fill="var(--v-bg)" stroke="var(--v)" stroke-width=".9"/>

    <text x="533" y="266" font-size="12" fill="#8a8a8a">⋮</text>

    <text x="528" y="294" font-size="10" fill="#6b6b6b">L28</text>
    <rect x="544" y="284" width="32" height="13" fill="var(--k-bg)" stroke="var(--k)" stroke-width=".9"/>
    <rect x="544" y="299" width="32" height="13" fill="var(--v-bg)" stroke="var(--v)" stroke-width=".9"/>
    <rect x="586" y="284" width="32" height="13" fill="var(--k-bg)" stroke="var(--k)" stroke-width=".9"/>
    <rect x="586" y="299" width="32" height="13" fill="var(--v-bg)" stroke="var(--v)" stroke-width=".9"/>
    <rect x="628" y="284" width="32" height="13" fill="var(--k-bg)" stroke="var(--k)" stroke-width=".9"/>
    <rect x="628" y="299" width="32" height="13" fill="var(--v-bg)" stroke="var(--v)" stroke-width=".9"/>

    <text x="712" y="252" font-size="9" fill="#8a8a8a">28 layers</text>
    <text x="712" y="263" font-size="9" fill="#8a8a8a">× tokens</text>
    <text x="712" y="274" font-size="9" fill="#8a8a8a">× K and V</text>
  </g>

  <!-- appended column on decode -->
  <g id="g-append" class="hidden">
    <text x="686" y="175" font-size="9.5" fill="#1a1a1a" text-anchor="middle">hi</text>
    <rect x="670" y="182" width="32" height="13" fill="var(--k-bg)" stroke="#1a1a1a" stroke-width="1.1"/>
    <rect x="670" y="197" width="32" height="13" fill="var(--v-bg)" stroke="#1a1a1a" stroke-width="1.1"/>
    <rect x="670" y="222" width="32" height="13" fill="var(--k-bg)" stroke="#1a1a1a" stroke-width="1.1"/>
    <rect x="670" y="237" width="32" height="13" fill="var(--v-bg)" stroke="#1a1a1a" stroke-width="1.1"/>
    <rect x="670" y="284" width="32" height="13" fill="var(--k-bg)" stroke="#1a1a1a" stroke-width="1.1"/>
    <rect x="670" y="299" width="32" height="13" fill="var(--v-bg)" stroke="#1a1a1a" stroke-width="1.1"/>
  </g>

  <!-- arithmetic -->
  <g id="g-math" class="hidden">
    <rect x="30" y="338" width="760" height="48" rx="4" fill="#fff" stroke="#1a1a1a"/>
    <text x="48" y="358" font-size="12.5">2 (K and V)  ×  512  ×  28 layers  ×  2 bytes (FP16)  =  57,344 bytes per token</text>
    <text x="48" y="376" font-size="12" fill="#6b6b6b">≈ 56 KB, held in GPU memory until the request finishes</text>
  </g>
</svg>

<div class="caption" id="cap"></div>

<div class="controls">
  <button id="prev">← Prev</button>
  <button id="next">Next →</button>
  <span class="count" id="count"></span>
  <div class="dots" id="dots"></div>
</div>
</div>

<script>
const steps = [
  {
    show: ["g-tokens","g-tokens-note"],
    cap: "The prompt <b>“hey my friend”</b> becomes three tokens, and each token is looked up in the embedding table to get a vector of 3584 numbers. Stacked together, that is <code>x</code> — a <code>[3 × 3584]</code> matrix. All three tokens travel through the network <b>together</b>, in one pass."
  },
  {
    show: ["g-tokens","g-tokens-note","g-layer"],
    cap: "Inside a layer, <code>x</code> is multiplied by three separate weight matrices, producing <b>Q</b>, <b>K</b>, and <b>V</b>. Each has one row per token. Note K and V are deliberately narrower than Q — 512 instead of 3584 — which matters a great deal for memory, since these are the two that get stored."
  },
  {
    show: ["g-tokens","g-layer","g-qdrop"],
    cap: "<b>Q is used once, then thrown away.</b> It computes this token's attention scores against the keys, and after that nothing will ever need it again. There is no reason to store it."
  },
  {
    show: ["g-tokens","g-layer","g-qdrop","g-tocache","g-cache","g-row1"],
    cap: "<b>K and V are kept</b> — one pair per token. Three tokens went in, so three pairs come out and get written to the cache. They are saved because every <i>future</i> token will attend back to them. The cache exists to spare the next thousand tokens from recomputing these three."
  },
  {
    show: ["g-tokens","g-layer","g-qdrop","g-tocache","g-cache","g-row1","g-rows"],
    cap: "And this repeats in <b>all 28 layers</b>. Every layer has its own weight matrices, so every layer produces its own K and V in its own representation space. Layer 20's keys mean something different from layer 1's, so none of them can be dropped. Three tokens now occupy 28 × 3 × 2 slots."
  },
  {
    show: ["g-tokens","g-newtok","g-layer","g-qdrop","g-tocache","g-cache","g-row1","g-rows","g-append"],
    cap: "Now the model generates <b>“hi”</b> and feeds it back in — <b>alone</b>. Only its K and V are computed, one pair per layer, appended to what is already there. The first three tokens are never reprocessed. This is why generating token 500 costs about the same as generating token 2."
  },
  {
    show: ["g-tokens","g-newtok","g-layer","g-qdrop","g-tocache","g-cache","g-row1","g-rows","g-append","g-math"],
    cap: "So the standing cost of one cached token: <b>K and V, 512 wide, across 28 layers, 2 bytes each ≈ 56 KB.</b> A 32,000-token conversation therefore holds about <b>1.8 GB</b> of KV cache — for one user. That is why serving large models is a memory problem before it is a compute problem."
  }
];

const allGroups = ["g-tokens","g-tokens-note","g-newtok","g-layer","g-qdrop","g-tocache","g-cache","g-row1","g-rows","g-append","g-math"];
let i = 0;

const capEl = document.getElementById("cap");
const countEl = document.getElementById("count");
const prevEl = document.getElementById("prev");
const nextEl = document.getElementById("next");
const dotsEl = document.getElementById("dots");

steps.forEach((_, n) => {
  const d = document.createElement("div");
  d.className = "dot";
  d.onclick = () => { i = n; render(); };
  dotsEl.appendChild(d);
});

function render() {
  const s = steps[i];
  allGroups.forEach(id => {
    document.getElementById(id).classList.toggle("hidden", !s.show.includes(id));
  });
  capEl.innerHTML = s.cap;
  countEl.textContent = (i + 1) + " / " + steps.length;
  prevEl.disabled = i === 0;
  nextEl.disabled = i === steps.length - 1;
  [...dotsEl.children].forEach((d, n) => d.classList.toggle("on", n === i));
}

prevEl.onclick = () => { if (i > 0) { i--; render(); } };
nextEl.onclick = () => { if (i < steps.length - 1) { i++; render(); } };
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") nextEl.click();
  if (e.key === "ArrowLeft") prevEl.click();
});

render();
</script>
</body>
</html>
