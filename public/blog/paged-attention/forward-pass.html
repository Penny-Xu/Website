<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One forward pass</title>
<style>
  :root {
    --ink: #1a1a1a; --muted: #6b6b6b; --line: #d4d4d4; --bg: #fdfdfc;
    --q: #c2742a; --q-bg: #faf0e3;
    --k: #2f6ea8; --k-bg: #e8f1f8;
    --v: #3d7a4e; --v-bg: #e9f3eb;
    --mlp: #7a4a8c; --mlp-bg: #f2eaf5;
    --panel: #f4f4f2;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width:840px; margin:0 auto; padding:16px 12px 24px; }
  svg { width:100%; height:auto; display:block; }
  text { font-family:"SF Mono", Menlo, Consolas, monospace; }
  .hidden { opacity:0; }
  g { transition:opacity .35s ease; }
  .caption { min-height:72px; margin:14px 2px 0; font-size:14.5px; line-height:1.6; }
  .caption b { font-weight:600; }
  .caption code { font-family:"SF Mono",Menlo,Consolas,monospace; font-size:13px;
    background:var(--panel); padding:1px 4px; border-radius:2px; }
  .controls { display:flex; align-items:center; gap:10px; margin-top:14px;
    padding-top:14px; border-top:1px solid var(--line); }
  button { font:inherit; font-size:13px; padding:6px 14px; border:1px solid var(--line);
    background:#fff; color:var(--ink); border-radius:3px; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--panel); }
  button:disabled { opacity:.4; cursor:default; }
  .count { font-family:"SF Mono",Menlo,Consolas,monospace; font-size:12.5px; color:var(--muted); }
  .dots { display:flex; gap:5px; margin-left:auto; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--line); cursor:pointer; }
  .dot.on { background:var(--ink); }
</style>
</head>
<body>
<div class="wrap">

<svg viewBox="0 0 820 400" role="img" aria-label="Forward pass animation">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- ============ 1. input + embedding ============ -->
  <g id="g-in">
    <text x="20" y="22" font-size="10" fill="#6b6b6b">INPUT</text>
    <g font-size="12">
      <rect x="20" y="30" width="140" height="24" rx="3" fill="#fff" stroke="#d4d4d4"/>
      <text x="90" y="47" text-anchor="middle">hey</text>
      <rect x="20" y="58" width="140" height="24" rx="3" fill="#fff" stroke="#d4d4d4"/>
      <text x="90" y="75" text-anchor="middle">my</text>
      <rect x="20" y="86" width="140" height="24" rx="3" fill="#fff" stroke="#d4d4d4"/>
      <text x="90" y="103" text-anchor="middle">friend</text>
    </g>
    <path d="M90,114 L90,134" fill="none" stroke="#8a8a8a" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="100" y="129" font-size="9.5" fill="#6b6b6b">embedding table</text>
    <text x="100" y="140" font-size="9.5" fill="#6b6b6b">152k × 3584 lookup</text>
    <rect x="20" y="146" width="140" height="26" rx="3" fill="var(--panel)" stroke="#d4d4d4"/>
    <text x="90" y="164" text-anchor="middle" font-size="11.5">x = 3 × 3584</text>
    <path d="M164,159 L196,159" fill="none" stroke="#8a8a8a" stroke-width="1.3" marker-end="url(#a)"/>
  </g>

  <!-- ============ 2. layer shell ============ -->
  <g id="g-layer" class="hidden">
    <rect x="200" y="20" width="360" height="330" rx="4" fill="none" stroke="#d4d4d4"/>
    <text x="214" y="38" font-size="10" fill="#6b6b6b">ONE LAYER — identical structure, repeated 28×</text>
    <text x="214" y="56" font-size="9.5" fill="#8a8a8a">shape in = shape out = 3 × 3584</text>
  </g>

  <!-- ============ 3. attention block ============ -->
  <g id="g-attn" class="hidden">
    <rect x="214" y="66" width="332" height="118" rx="3" fill="#fff" stroke="#b8b8b8"/>
    <text x="226" y="82" font-size="9.5" fill="#6b6b6b">ATTENTION — tokens exchange information</text>

    <rect x="226" y="92" width="104" height="22" rx="2" fill="var(--q-bg)" stroke="var(--q)"/>
    <text x="278" y="107" text-anchor="middle" font-size="9.5" fill="var(--q)">Q  3 × 3584</text>
    <rect x="226" y="118" width="104" height="22" rx="2" fill="var(--k-bg)" stroke="var(--k)"/>
    <text x="278" y="133" text-anchor="middle" font-size="9.5" fill="var(--k)">K  3 × 512</text>
    <rect x="226" y="144" width="104" height="22" rx="2" fill="var(--v-bg)" stroke="var(--v)"/>
    <text x="278" y="159" text-anchor="middle" font-size="9.5" fill="var(--v)">V  3 × 512</text>
    <text x="226" y="179" font-size="8.5" fill="#8a8a8a">computed here, from x, by W_Q / W_K / W_V — one row per token</text>

    <path d="M334,103 L342,120" fill="none" stroke="#8a8a8a" stroke-width="1.1" marker-end="url(#a)"/>
    <path d="M334,129 L342,127" fill="none" stroke="#8a8a8a" stroke-width="1.1" marker-end="url(#a)"/>
    <rect x="346" y="114" width="94" height="24" rx="2" fill="var(--panel)" stroke="#b8b8b8"/>
    <text x="393" y="130" text-anchor="middle" font-size="9.5">QKᵀ → softmax</text>

    <path d="M334,155 L448,150" fill="none" stroke="var(--v)" stroke-width="1.1" marker-end="url(#a)"/>
    <path d="M444,126 L448,126" fill="none" stroke="#8a8a8a" stroke-width="1.1" marker-end="url(#a)"/>
    <rect x="452" y="114" width="84" height="24" rx="2" fill="var(--panel)" stroke="#b8b8b8"/>
    <text x="494" y="130" text-anchor="middle" font-size="9.5">× V → W_O</text>
    <text x="452" y="162" font-size="8.5" fill="#8a8a8a">back to 3 × 3584</text>
  </g>

  <!-- ============ 4. mlp block ============ -->
  <g id="g-mlp" class="hidden">
    <path d="M380,188 L380,204" fill="none" stroke="#8a8a8a" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="388" y="200" font-size="9" fill="#8a8a8a">+ residual, norm</text>

    <rect x="214" y="208" width="332" height="100" rx="3" fill="#fff" stroke="#b8b8b8"/>
    <text x="226" y="224" font-size="9.5" fill="#6b6b6b">MLP — each token processed alone</text>

    <rect x="226" y="236" width="80" height="24" rx="2" fill="var(--mlp-bg)" stroke="var(--mlp)"/>
    <text x="266" y="252" text-anchor="middle" font-size="9.5" fill="var(--mlp)">3584</text>
    <path d="M310,248 L336,248" fill="none" stroke="#8a8a8a" stroke-width="1.1" marker-end="url(#a)"/>
    <rect x="340" y="236" width="80" height="24" rx="2" fill="var(--mlp-bg)" stroke="var(--mlp)"/>
    <text x="380" y="252" text-anchor="middle" font-size="9.5" fill="var(--mlp)">18944</text>
    <path d="M424,248 L450,248" fill="none" stroke="#8a8a8a" stroke-width="1.1" marker-end="url(#a)"/>
    <rect x="454" y="236" width="80" height="24" rx="2" fill="var(--mlp-bg)" stroke="var(--mlp)"/>
    <text x="494" y="252" text-anchor="middle" font-size="9.5" fill="var(--mlp)">3584</text>

    <text x="266" y="276" text-anchor="middle" font-size="9" fill="#8a8a8a">expand</text>
    <text x="380" y="276" text-anchor="middle" font-size="9" fill="#8a8a8a">SiLU gate</text>
    <text x="494" y="276" text-anchor="middle" font-size="9" fill="#8a8a8a">contract</text>
    <text x="226" y="294" font-size="9" fill="#8a8a8a">88% of this layer's weights live here</text>

    <path d="M380,312 L380,332" fill="none" stroke="#8a8a8a" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="388" y="328" font-size="9" fill="#8a8a8a">+ residual, norm</text>
  </g>

  <!-- ============ 5. ×28 loop ============ -->
  <g id="g-loop" class="hidden">
    <path d="M560,250 C590,250 590,98 564,98" fill="none" stroke="#1a1a1a"
          stroke-width="1.3" marker-end="url(#ad)"/>
    <text x="214" y="370" font-size="10" fill="#1a1a1a">repeat 28× — same structure, new weights every layer</text>
    <text x="214" y="384" font-size="9" fill="#8a8a8a">the matrix keeps its 3 × 3584 shape the entire way down</text>
  </g>

  <!-- ============ 6. output path ============ -->
  <g id="g-out" class="hidden">
    <text x="604" y="30" font-size="10" fill="#6b6b6b">AFTER 28 LAYERS</text>
    <rect x="604" y="38" width="196" height="24" rx="3" fill="var(--panel)" stroke="#d4d4d4"/>
    <text x="702" y="54" text-anchor="middle" font-size="10.5">3 × 3584</text>
    <text x="604" y="78" font-size="9" fill="#8a8a8a">keep only the LAST row — it is</text>
    <text x="604" y="89" font-size="9" fill="#8a8a8a">the only one that has seen</text>
    <text x="604" y="100" font-size="9" fill="#8a8a8a">the whole prompt</text>
    <rect x="604" y="106" width="196" height="24" rx="3" fill="#fff" stroke="#1a1a1a"/>
    <text x="702" y="122" text-anchor="middle" font-size="10.5">1 × 3584</text>
  </g>

  <!-- ============ 7. lm head ============ -->
  <g id="g-head" class="hidden">
    <path d="M702,134 L702,154" fill="none" stroke="#8a8a8a" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="604" y="158" width="196" height="26" rx="3" fill="var(--panel)" stroke="#b8b8b8"/>
    <text x="702" y="175" text-anchor="middle" font-size="10">LM head  3584 × 152k</text>
    <path d="M702,188 L702,208" fill="none" stroke="#8a8a8a" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="604" y="212" width="196" height="24" rx="3" fill="#fff" stroke="#d4d4d4"/>
    <text x="702" y="228" text-anchor="middle" font-size="10">logits  1 × 152,000</text>
    <text x="604" y="250" font-size="9" fill="#8a8a8a">one score per vocabulary entry</text>
  </g>

  <!-- ============ 8. sample ============ -->
  <g id="g-sample" class="hidden">
    <path d="M702,256 L702,274" fill="none" stroke="#8a8a8a" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="712" y="270" font-size="9" fill="#8a8a8a">softmax, sample</text>
    <rect x="648" y="278" width="108" height="30" rx="3" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="702" y="298" text-anchor="middle" font-size="13">hi</text>
    <text x="604" y="328" font-size="9" fill="#1a1a1a">ONE token. For the next one,</text>
    <text x="604" y="340" font-size="9" fill="#1a1a1a">the whole pass runs again.</text>
  </g>
</svg>

<div class="caption" id="cap"></div>

<div class="controls">
  <button id="prev">← Prev</button>
  <button id="next">Next →</button>
  <span class="count" id="count"></span>
  <div class="dots" id="dots"></div>
</div>
</div>

<script>
const steps = [
  { show:["g-in"],
    cap:"<b>“hey my friend”</b> becomes three integers, and each integer indexes a row of the embedding table — a <code>152,000 × 3584</code> matrix of learned vectors. The result is <code>x</code>, a <code>[3 × 3584]</code> matrix. Note this is a <i>lookup</i>, not a computation." },

  { show:["g-in","g-layer"],
    cap:"<code>x</code> enters the first of <b>28 identical layers</b>. Identical in structure, not in weights — each layer has its own. The crucial property: shape in equals shape out. Every layer takes <code>[3 × 3584]</code> and returns <code>[3 × 3584]</code>, refining the values rather than reshaping them." },

  { show:["g-in","g-layer","g-attn"],
    cap:"First sub-block: <b>attention</b> — and this is <b>where Q, K, and V are computed</b>, by multiplying <code>x</code> against three separate weight matrices. Q comes out <code>[3 × 3584]</code>, while K and V are deliberately narrower at <code>[3 × 512]</code>. Then Q scores against every K, softmax turns those scores into weights, the weights blend V, and <code>W_O</code> projects the result back to 3584 wide. <b>This is the only place in the model where tokens see each other.</b>" },

  { show:["g-in","g-layer","g-attn","g-mlp"],
    cap:"Second sub-block: the <b>MLP</b>. Expand each token from 3584 to 18944, apply a gated nonlinearity, contract back. <b>No token interaction at all</b> — the same weights applied to each row independently. Attention gathers context; the MLP thinks about what was gathered. And 88% of the layer's weights sit here." },

  { show:["g-in","g-layer","g-attn","g-mlp","g-loop"],
    cap:"That pair — attention then MLP, each wrapped in a residual add and a normalization — <b>repeats 28 times</b>, with fresh weights every layer. The matrix keeps its shape the entire way down. Depth is what lets later layers build on relationships earlier ones established." },

  { show:["g-in","g-layer","g-attn","g-mlp","g-loop","g-out"],
    cap:"Out of layer 28 comes a <code>[3 × 3584]</code> matrix — one vector per token. But <b>only the last row is used.</b> Because of causal masking, each row has only seen itself and the tokens before it, so the row for “friend” is the only one that has seen the whole prompt. It is the only row qualified to predict what comes next." },

  { show:["g-in","g-layer","g-attn","g-mlp","g-loop","g-out","g-head"],
    cap:"That single <code>[1 × 3584]</code> vector is multiplied by the <b>LM head</b>, a <code>3584 × 152,000</code> matrix whose every column stands for one vocabulary entry. The result is 152,000 logits — a score for how well the output vector matches each possible next token. This is one of the largest matmuls in the entire pass." },

  { show:["g-in","g-layer","g-attn","g-mlp","g-loop","g-out","g-head","g-sample"],
    cap:"Softmax turns those logits into probabilities, one is sampled, and its index maps back to text: <b>“hi”</b>. That is the complete cost of <b>one token</b> — every weight in the model read, 28 layers traversed, 152,000 scores computed. For the next token, all of it runs again." }
];

const allGroups = ["g-in","g-layer","g-attn","g-mlp","g-loop","g-out","g-head","g-sample"];
let i = 0;
const capEl=document.getElementById("cap"), countEl=document.getElementById("count"),
      prevEl=document.getElementById("prev"), nextEl=document.getElementById("next"),
      dotsEl=document.getElementById("dots");

steps.forEach((_,n)=>{ const d=document.createElement("div"); d.className="dot";
  d.onclick=()=>{i=n;render();}; dotsEl.appendChild(d); });

function render(){
  const s=steps[i];
  allGroups.forEach(id=>document.getElementById(id).classList.toggle("hidden",!s.show.includes(id)));
  capEl.innerHTML=s.cap;
  countEl.textContent=(i+1)+" / "+steps.length;
  prevEl.disabled=i===0; nextEl.disabled=i===steps.length-1;
  [...dotsEl.children].forEach((d,n)=>d.classList.toggle("on",n===i));
}
prevEl.onclick=()=>{ if(i>0){i--;render();} };
nextEl.onclick=()=>{ if(i<steps.length-1){i++;render();} };
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")nextEl.click();
  if(e.key==="ArrowLeft")prevEl.click();
});
render();
</script>
</body>
</html>
